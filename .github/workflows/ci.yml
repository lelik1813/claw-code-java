name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  unit-tests:
    name: Unit tests (no DB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./mvnw test -B

  integration-tests:
    name: Integration tests (Testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./mvnw verify -B

  smoke:
    name: Smoke test (standalone JAR)
    runs-on: ubuntu-latest
    needs: [unit-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build JAR
        run: ./mvnw package -DskipTests -B
      - name: Start server
        run: |
          java -jar target/claw-code-java-*.jar \
            --app.persistence.backend=in-memory \
            --app.security.api-key.enabled=true \
            --app.security.api-key.key=smoke-test-key \
            --app.rate-limit.enabled=false \
            --server.port=8080 &
          echo "Waiting for server..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/actuator/health 2>/dev/null | grep -q UP; then
              echo "Server is UP"
              break
            fi
            sleep 1
          done
      - name: Run smoke
        env:
          BASE_URL: http://localhost:8080
          API_KEY: smoke-test-key
        run: bash scripts/phase8-smoke.sh
      - name: Stop server
        if: always()
        run: kill %1 2>/dev/null || true
