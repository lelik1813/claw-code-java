# Unit-test defaults — surefire only (*IT classes excluded by failsafe).
# These exclusions prevent JDBC/R2DBC/Flyway connection attempts during mvn test.
# IT classes clear spring.autoconfigure.exclude= via @TestPropertySource.
PERSISTENCE_BACKEND=in-memory
# Keep test context deterministic regardless of developer .env values.
app.security.api-key.enabled=false
app.security.rate-limit.enabled=false
app.tools.enabled=false
spring.autoconfigure.exclude=\
  org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration,\
  org.springframework.boot.r2dbc.autoconfigure.R2dbcAutoConfiguration,\
  org.springframework.boot.r2dbc.autoconfigure.R2dbcDataAutoConfiguration,\
  org.springframework.boot.r2dbc.autoconfigure.R2dbcRepositoriesAutoConfiguration,\
  org.springframework.boot.r2dbc.autoconfigure.R2dbcTransactionManagerAutoConfiguration,\
  org.springframework.boot.flyway.autoconfigure.FlywayAutoConfiguration
